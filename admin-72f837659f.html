<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel de expedición — Leer es viajar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #1d9e75; --forest: #0f6e56; --paper: #faf7f2; --white: #ffffff;
    --ink: #1a1a18; --muted: #9a948d; --line: #ece8e1;
    --fiction: #e8913c; --route: #e8593c; --mint: #9fd9c0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.5; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 28px 20px 64px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .wordmark { font-family: 'Instrument Serif', serif; font-size: 26px; }
  .wordmark em { color: var(--teal); }
  .sub { color: var(--muted); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
  .meta { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--muted); }
  .meta button, .login-card button { font: inherit; cursor: pointer; }
  .btn-ghost { background: none; border: none; color: var(--teal); text-decoration: underline; padding: 0; }

  .section-title { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    margin: 30px 0 10px; display: flex; align-items: center; gap: 10px; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .card { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .card .num { font-family: 'Instrument Serif', serif; font-size: 34px; line-height: 1.1; }
  .card .lbl { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .card .note { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 700px) { .cols { grid-template-columns: 1fr; } }
  .panel { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }

  .bar-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .bar-lbl { width: 42%; min-width: 0; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; height: 8px; background: var(--paper); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--teal); border-radius: 4px; }
  .bar-fill.orange { background: var(--fiction); }
  .bar-n { width: 44px; text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  td, th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; }
  th { font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  tr:last-child td { border-bottom: none; }
  td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
  .fic { color: var(--fiction); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--white); border: 1px solid var(--line); border-radius: 20px; padding: 6px 14px; font-size: 12.5px; }
  .chip b { font-weight: 600; color: var(--forest); }

  .pctl { display: flex; gap: 18px; margin-top: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .pctl b { color: var(--ink); font-weight: 600; }

  .login-card { max-width: 340px; margin: 12vh auto; background: var(--white); border: 1px solid var(--line);
    border-radius: 12px; padding: 26px; }
  .login-card h1 { font-family: 'Instrument Serif', serif; font-size: 22px; font-weight: 400; margin-bottom: 14px; }
  .login-card input { width: 100%; padding: 9px 11px; margin-bottom: 9px; border: 1px solid var(--line);
    border-radius: 8px; font: inherit; background: var(--paper); }
  .login-card input:focus { outline: 2px solid var(--mint); border-color: var(--teal); }
  .btn-main { width: 100%; padding: 9px; border: none; border-radius: 8px; background: var(--teal);
    color: var(--white); font-weight: 500; }
  .btn-google { width: 100%; padding: 9px; margin-top: 8px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--white); }
  .err { color: var(--route); font-size: 12.5px; margin-top: 10px; }
  .hidden { display: none; }
  #loading { color: var(--muted); margin-top: 40px; text-align: center; }
</style>
</head>
<body>

<div id="login-view" class="hidden">
  <div class="login-card">
    <h1>Leer <em style="color:var(--teal)">es</em> viajar · admin</h1>
    <input type="email" id="email" placeholder="correo@ejemplo.com" autocomplete="email">
    <input type="password" id="password" placeholder="contraseña" autocomplete="current-password">
    <button class="btn-main" id="btn-login">Entrar</button>
    <button class="btn-google" id="btn-google">Entrar con Google</button>
    <div class="err hidden" id="login-err"></div>
  </div>
</div>

<div id="dash-view" class="wrap hidden">
  <header>
    <div>
      <div class="wordmark">Leer <em>es</em> viajar</div>
      <div class="sub">Panel de expedición</div>
    </div>
    <div class="meta">
      <span id="updated-at"></span>
      <button class="btn-ghost" id="btn-refresh">Actualizar</button>
      <button class="btn-ghost" id="btn-logout">Salir</button>
    </div>
  </header>

  <div id="loading">Cargando estadísticas…</div>
  <div class="err hidden" id="dash-err"></div>

  <div id="content" class="hidden">
    <div class="section-title">La expedición</div>
    <div class="cards" id="cards-main"></div>

    <div class="section-title">Salud y activación</div>
    <div class="cards" id="cards-health"></div>

    <div class="cols" style="margin-top:26px">
      <div class="panel">
        <div class="section-title" style="margin-top:0">Sales desde…</div>
        <div id="dep-modes"></div>
      </div>
      <div class="panel">
        <div class="section-title" style="margin-top:0">Logros conseguidos</div>
        <div id="badges-funnel"></div>
      </div>
    </div>

    <div class="panel" style="margin-top:10px">
      <div class="section-title" style="margin-top:0">Km por ruta</div>
      <div id="km-buckets"></div>
      <div class="pctl" id="km-pctl"></div>
    </div>

    <div class="cols" style="margin-top:10px">
      <div class="panel">
        <div class="section-title" style="margin-top:0">Destinos más visitados</div>
        <table id="top-dest"></table>
      </div>
      <div class="panel">
        <div class="section-title" style="margin-top:0">Libros más leídos</div>
        <table id="top-books"></table>
      </div>
    </div>

    <div class="section-title">Comportamiento</div>
    <div class="chips" id="behavior"></div>

    <div class="panel" style="margin-top:26px">
      <div class="section-title" style="margin-top:0">Últimos guardados</div>
      <table id="last-active"></table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://mvmpxbyflklqcmunmywq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12bXB4YnlmbGtscWNtdW5teXdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1NTYyMjcsImV4cCI6MjA5ODEzMjIyN30.xG5GHJnwvcAylHNmDOTcqlNGrtiKzk1I_pGWH8Suqyc';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const BADGE_NAMES = {
  explorer_1: '🧭 He llegado antes que nadie', explorer_3: '🗺️ He cartografiado 3 destinos',
  explorer_10: '⚓ Estuve antes que nadie en 10 destinos', books_5: '📚 He añadido 5 lecturas',
  books_20: '🌍 He viajado a 20 destinos', fictional: '✨ He viajado a un lugar imaginario',
  km_10k: '🌐 Más de 10.000 km leyendo', countries_5: '🛂 He viajado a 5 países'
};
const DEP_NAMES = { last: 'Último destino', home: 'Casa', other: 'Otro lugar', '(sin dato)': 'Sin dato' };
const KM_BUCKET_LABELS = { cero: '0 km', b1: 'menos de 100', b2: '100 – 500', b3: '500 – 1.500', b4: '1.500 – 5.000', b5: 'más de 5.000' };

const $ = id => document.getElementById(id);
const fmt = n => (n ?? 0).toLocaleString('es-ES');
const fmtKm = n => n >= 10000 ? (n/1000).toLocaleString('es-ES', {maximumFractionDigits:1}) + 'k' : fmt(n);
let refreshTimer = null;

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) { showDash(); } else { showLogin(); }
  sb.auth.onAuthStateChange((_e, s) => { if (s) showDash(); });
}

function showLogin() { $('login-view').classList.remove('hidden'); $('dash-view').classList.add('hidden'); }

function showDash() {
  $('login-view').classList.add('hidden'); $('dash-view').classList.remove('hidden');
  loadStats();
  clearInterval(refreshTimer);
  refreshTimer = setInterval(loadStats, 5 * 60 * 1000);
}

$('btn-login').addEventListener('click', async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  if (error) { $('login-err').textContent = 'No se pudo iniciar sesión. Revisa el correo y la contraseña.'; $('login-err').classList.remove('hidden'); }
});
$('password').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn-login').click(); });
$('btn-google').addEventListener('click', () => {
  sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + window.location.pathname } });
});
$('btn-logout').addEventListener('click', async () => { clearInterval(refreshTimer); await sb.auth.signOut(); showLogin(); });
$('btn-refresh').addEventListener('click', loadStats);

async function loadStats() {
  $('dash-err').classList.add('hidden');
  const { data, error } = await sb.rpc('admin_stats');
  $('loading').classList.add('hidden');
  if (error) {
    $('content').classList.add('hidden');
    $('dash-err').textContent = /no autorizado/i.test(error.message)
      ? 'Esta cuenta no tiene acceso al panel.'
      : 'No se pudieron cargar las estadísticas: ' + error.message;
    $('dash-err').classList.remove('hidden');
    return;
  }
  render(data);
  $('content').classList.remove('hidden');
  $('updated-at').textContent = 'Actualizado a las ' + new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
}

function card(num, lbl, note) {
  return `<div class="card"><div class="num">${num}</div><div class="lbl">${lbl}</div>${note ? `<div class="note">${note}</div>` : ''}</div>`;
}

function bars(el, obj, labels, denomHint, orangeKeys) {
  const entries = Object.entries(obj).sort((a,b) => b[1] - a[1]);
  const max = Math.max(1, ...entries.map(e => e[1]));
  el.innerHTML = entries.map(([k, n]) =>
    `<div class="bar-row"><div class="bar-lbl" title="${labels[k] || k}">${labels[k] || k}</div>
     <div class="bar-track"><div class="bar-fill${(orangeKeys||[]).includes(k) ? ' orange' : ''}" style="width:${Math.round(100*n/max)}%"></div></div>
     <div class="bar-n">${fmt(n)}${denomHint ? '/' + denomHint : ''}</div></div>`).join('')
    || '<div class="note" style="color:var(--muted)">Sin datos todavía.</div>';
}

function render(d) {
  const badgesTotal = Object.values(d.badges_funnel || {}).reduce((s,n) => s + n, 0);
  $('cards-main').innerHTML =
    card(fmt(d.users_total), 'Personas registradas') +
    card(fmt(d.entries_total), 'Lecturas') +
    card(fmtKm(d.km_total), 'Km leídos') +
    card(fmt(d.destinations), 'Destinos distintos') +
    card(fmt(d.countries), 'Países') +
    card(fmt(d.pioneers_total), 'Primeras llegadas') +
    card(fmt(badgesTotal), 'Logros conseguidos') +
    card(fmt(d.beta_requests), 'Solicitudes de beta', d.beta_conversion_pct != null ? d.beta_conversion_pct + '% registradas' : '');

  $('cards-health').innerHTML =
    card((d.activation_pct ?? 0) + '%', 'Activación', `${fmt(d.users_with_entries)} con lecturas de ${fmt(d.users_total)}`) +
    card(fmt(d.active_7d), 'Activas · 7 días') +
    card(fmt(d.active_30d), 'Activas · 30 días') +
    card(fmt(Math.round(d.median_entries_per_user ?? 0)), 'Mediana lecturas/persona', `máximo: ${fmt(d.max_entries_per_user)}`);

  bars($('dep-modes'), d.departure_modes || {}, DEP_NAMES);
  bars($('badges-funnel'), d.badges_funnel || {}, BADGE_NAMES, fmt(d.users_total));

  const kb = d.km_buckets || {};
  bars($('km-buckets'), Object.fromEntries(Object.keys(KM_BUCKET_LABELS).filter(k => k in kb).map(k => [k, kb[k]])), KM_BUCKET_LABELS, null, ['cero']);
  const p = d.km_percentiles || {};
  $('km-pctl').innerHTML = ['p25','p50','p75','p90'].map(k => `<span>${k} <b>${fmt(p[k])} km</b></span>`).join('');

  $('top-dest').innerHTML = '<tr><th>Destino</th><th class="r">Lecturas</th></tr>' +
    (d.top_destinations || []).map(t => `<tr><td>${t.fictional ? '<span class="fic">✦</span> ' : ''}${t.dest}</td><td class="r">${fmt(t.n)}</td></tr>`).join('');
  $('top-books').innerHTML = '<tr><th>Libro</th><th class="r">Lecturas</th></tr>' +
    (d.top_books || []).map(t => `<tr><td>${t.book}</td><td class="r">${fmt(t.n)}</td></tr>`).join('');

  $('behavior').innerHTML =
    `<span class="chip">Con nota: <b>${d.notes_pct ?? 0}%</b></span>` +
    `<span class="chip">Con referencia de libro: <b>${d.bookref_pct ?? 0}%</b></span>` +
    `<span class="chip">Destinos ficticios: <b>${d.fictional_pct ?? 0}%</b> (${fmt(d.fictional_users)} personas)</span>` +
    `<span class="chip">Lecturas de los últimos 30 días: <b>${d.recent30_pct ?? 0}%</b></span>` +
    `<span class="chip">Destinos repetidos por la misma persona: <b>${fmt(d.rereads_pairs)}</b></span>`;

  $('last-active').innerHTML = '<tr><th>Persona</th><th class="r">Lecturas</th><th class="r">Último guardado</th></tr>' +
    (d.last_active || []).map(u => `<tr><td>${u.name}</td><td class="r">${fmt(u.entries)}</td><td class="r">${relTime(u.last_save)}</td></tr>`).join('');
}

function relTime(iso) {
  if (!iso) return '—';
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 60) return `hace ${mins} min`;
  if (mins < 1440) return `hace ${Math.round(mins/60)} h`;
  return `hace ${Math.round(mins/1440)} días`;
}

init();
</script>
</body>
</html>
